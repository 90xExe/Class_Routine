name: Sync official routine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: routine-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VU_STUDENT_ROLL: ${{ secrets.VU_STUDENT_ROLL }}
      VU_STUDENT_PASSWORD: ${{ secrets.VU_STUDENT_PASSWORD }}

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install sync dependency
        run: python -m pip install -r requirements.txt

      - name: Read the official routines
        run: python sync_routines.py

      - name: Publish data changes
        shell: bash
        run: |
          if git diff --quiet -- routine.json; then
            echo "No published routine changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routine.json
          git commit -m "chore: sync official CSE routine"
          git push
